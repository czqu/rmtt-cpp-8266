; RMTT library project root. The library itself lives in src/ + include/.
; Example apps that link this library live in examples/ and are built with:
;   pio run -d examples/demo -e esp8266-tcp
;   pio run -d examples/demo -e esp8266-tls
; To flash an example to a board:
;   pio run -d examples/demo -e esp8266-tcp -t upload
[platformio]
